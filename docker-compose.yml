# 架構調整(2026-08-27)：拿掉 Postgres + Redis + Channels，worker 直接把
# tick 快照寫成 JSON 檔到 flowdata volume，backend 只負責把檔案伺服出去、
# 做簡易登入 session；兩個服務共用同一個 flowdata volume。

services:
  backend:
    build: ./backend
    container_name: stock_backend
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./flowdata:/data/flowdata
    ports:
      - "8000:8000"
    environment:
      - FLOWDATA_DIR=/data/flowdata
      - APP_USERNAME=${APP_USERNAME}
      - APP_PASSWORD=${APP_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}

  worker:
    build: ./worker
    container_name: stock_worker
    # 收盤後 worker 會自己正常結束(exit code 0)，這不算失敗，所以用
    # on-failure 而不是 always/unless-stopped，避免收盤自我結束後被
    # docker 一直重開又立刻退出，變成無限迴圈。真正的「crash」(非 0
    # 結束)才會被自動重試，最多 5 次。每個交易日開盤前要重新拉起來，
    # 是靠雲端主機上的 crontab 排程執行 `docker compose up -d worker`，
    # 不是靠這個 restart policy。
    restart: on-failure:5
    command: python main.py
    volumes:
      - ./worker:/app
      - ./flowdata:/data/flowdata
    environment:
      - SHIOAJI_API_KEY=${SHIOAJI_API_KEY}
      - SHIOAJI_SECRET_KEY=${SHIOAJI_SECRET_KEY}
      # 2026-08-28 新增：多連線/多帳號支援。.env 沒設定這幾個變數時用預設值
      # (CONNECTIONS_PER_ACCOUNT 預設 5、第二組帳號空字串代表沒有)，所以現在
      # 這個單帳號版本不需要改 .env；之後如果想加第二組帳號，只要在 .env 加
      # SHIOAJI_API_KEY_2 / SHIOAJI_SECRET_KEY_2，不用再改這個檔案。
      - CONNECTIONS_PER_ACCOUNT=${CONNECTIONS_PER_ACCOUNT:-5}
      - SHIOAJI_API_KEY_2=${SHIOAJI_API_KEY_2:-}
      - SHIOAJI_SECRET_KEY_2=${SHIOAJI_SECRET_KEY_2:-}
      - FLOWDATA_DIR=/data/flowdata
      - SNAPSHOT_SEC=${SNAPSHOT_SEC}

  frontend:
    build: ./frontend
    container_name: stock_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
